name: PR Auto Review

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Call Agent for PR Review
        id: agent
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SESSION_ID: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
        run: |
          PROMPT="请审查以下 Pull Request：
          - 仓库: ${REPO}
          - PR #${PR_NUMBER}: ${PR_TITLE}
          - 链接: ${PR_URL}
          - 作者: ${AUTHOR}
          - 分支: ${HEAD_REF} → ${BASE_REF}

          请分析变更内容、评估风险等级，并给出审查意见。
          最后一行请明确输出：MERGE_DECISION: APPROVE 或 MERGE_DECISION: REQUEST_CHANGES"

          # 调用 Agent API（SSE 流式），保存原始响应到文件
          curl -sN -X POST http://aigw.agentscraft.com/githubtl/api/console/chat \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "X-Agent-Id: default" \
            -H "x-api-key: ${AGENT_API_KEY}" \
            --max-time 300 \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              --arg session "$SESSION_ID" \
              '{
                input: [{ role: "user", content: [{ type: "text", text: $prompt }] }],
                session_id: $session,
                user_id: "default",
                channel: "github-cli",
                stream: true
              }')" > /tmp/sse_response.txt

          # 用 Python 可靠地解析 SSE 响应
          python3 -c "
          import json, sys
          review_text = ''
          with open('/tmp/sse_response.txt', 'r') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('data: '):
                      continue
                  try:
                      d = json.loads(line[6:])
                      if d.get('object') == 'content' and d.get('status') == 'completed' and d.get('text'):
                          review_text = d['text']
                  except:
                      pass
          if not review_text:
              review_text = '⚠️ Agent 未返回有效审查结果，请手动检查。'
          with open('/tmp/review.md', 'w') as f:
              f.write(review_text)
          # 提取 merge decision
          decision = 'UNKNOWN'
          if 'MERGE_DECISION: APPROVE' in review_text:
              decision = 'APPROVE'
          elif 'MERGE_DECISION: REQUEST_CHANGES' in review_text:
              decision = 'REQUEST_CHANGES'
          with open('/tmp/merge_decision.txt', 'w') as f:
              f.write(decision)
          print(f'Review length: {len(review_text)}, Decision: {decision}')
          "

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **AI Code Review**\n\n${review}`
            });

      - name: Auto Merge if Approved
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DECISION=$(cat /tmp/merge_decision.txt)
          echo "Merge decision: $DECISION"
          if [ "$DECISION" = "APPROVE" ]; then
            echo "Auto-merging PR #${PR_NUMBER}..."
            gh pr merge ${PR_NUMBER} --merge --auto
          else
            echo "PR not approved for auto-merge. Decision: $DECISION"
          fi
