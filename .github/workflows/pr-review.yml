name: PR Auto Review

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Agent Review and Poll for Result
        id: agent
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SESSION_ID: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
        run: |
          API_URL="http://aigw.agentscraft.com/githubtl/api/console/chat"
          MAX_POLLS=40
          POLL_INTERVAL=30

          # Step 1: Send initial review request (triggers Task creation)
          echo "=== Sending initial review request ==="
          curl -sN -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "X-Agent-Id: default" \
            -H "x-api-key: ${AGENT_API_KEY}" \
            --max-time 120 \
            -d "$(jq -n \
              --arg prompt "请审查以下 Pull Request：\n- 仓库: ${REPO}\n- PR #${PR_NUMBER}: ${PR_TITLE}\n- 链接: ${PR_URL}\n- 作者: ${AUTHOR}\n- 分支: ${HEAD_REF} → ${BASE_REF}\n\n请分析变更内容、评估风险等级，并给出审查意见。无论任务简单与复杂，你都需要创建任务，你负责分析任务、拆解任务、将任务分配给你Team里的成员。任务评审人为你Team里的Human管理员。\n审查完成后，最后一行请明确输出：MERGE_DECISION: APPROVE 或 MERGE_DECISION: REQUEST_CHANGES" \
              --arg session "$SESSION_ID" \
              '{input: [{ role: "user", content: [{ type: "text", text: $prompt }] }], session_id: $session, user_id: "default", channel: "github-cli", stream: true}')" > /tmp/sse_response.txt

          # Parse initial response
          python3 -c "
          import json
          text = ''
          with open('/tmp/sse_response.txt') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('data: '): continue
                  try:
                      d = json.loads(line[6:])
                      if d.get('object') == 'content' and d.get('status') == 'completed' and d.get('text'):
                          text = d['text']
                  except: pass
          print(f'Initial reply: {text[:200]}')
          "

          # Step 2: Poll for final result
          echo ""
          echo "=== Polling for review result (max ${MAX_POLLS} attempts, ${POLL_INTERVAL}s interval) ==="

          FINAL_REVIEW=""
          DECISION="UNKNOWN"

          for i in $(seq 1 $MAX_POLLS); do
            echo "Poll attempt $i/$MAX_POLLS..."
            sleep $POLL_INTERVAL

            curl -sN -X POST "$API_URL" \
              -H "Content-Type: application/json" \
              -H "Accept: text/event-stream" \
              -H "X-Agent-Id: default" \
              -H "x-api-key: ${AGENT_API_KEY}" \
              --max-time 120 \
              -d "$(jq -n \
                --arg session "$SESSION_ID" \
                '{input: [{ role: "user", content: [{ type: "text", text: "你的PR审查完成了吗？如果已完成，请返回完整的审查结果，并在最后一行输出 MERGE_DECISION: APPROVE 或 MERGE_DECISION: REQUEST_CHANGES。如果还在进行中，请回复：REVIEW_IN_PROGRESS" }] }], session_id: $session, user_id: "default", channel: "github-cli", stream: true}')" > /tmp/sse_poll.txt

            # Parse poll response
            RESULT=$(python3 -c "
          import json
          text = ''
          with open('/tmp/sse_poll.txt') as f:
              for line in f:
                  line = line.strip()
                  if not line.startswith('data: '): continue
                  try:
                      d = json.loads(line[6:])
                      if d.get('object') == 'content' and d.get('status') == 'completed' and d.get('text'):
                          text = d['text']
                  except: pass
          print(text)
          ")

            echo "  Reply: ${RESULT:0:100}..."

            # Check if review is complete
            if echo "$RESULT" | grep -q "MERGE_DECISION: APPROVE"; then
              FINAL_REVIEW="$RESULT"
              DECISION="APPROVE"
              echo "  ✅ Review completed: APPROVE"
              break
            elif echo "$RESULT" | grep -q "MERGE_DECISION: REQUEST_CHANGES"; then
              FINAL_REVIEW="$RESULT"
              DECISION="REQUEST_CHANGES"
              echo "  ⚠️ Review completed: REQUEST_CHANGES"
              break
            elif echo "$RESULT" | grep -q "REVIEW_IN_PROGRESS"; then
              echo "  ⏳ Still in progress, continuing to poll..."
            else
              # Might be a complete review without the marker
              if [ ${#RESULT} -gt 100 ]; then
                FINAL_REVIEW="$RESULT"
                DECISION="UNKNOWN"
                echo "  ⚠️ Got substantial reply but no MERGE_DECISION marker"
                break
              fi
              echo "  ⏳ Waiting..."
            fi
          done

          # Fallback
          if [ -z "$FINAL_REVIEW" ]; then
            FINAL_REVIEW="⚠️ Agent 审查超时（$((MAX_POLLS * POLL_INTERVAL))秒），请手动检查。"
            DECISION="UNKNOWN"
          fi

          echo "$FINAL_REVIEW" > /tmp/review.md
          echo "$DECISION" > /tmp/merge_decision.txt
          echo ""
          echo "=== Final: Decision=$DECISION, Review length=${#FINAL_REVIEW} ==="

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **AI Code Review**\n\n${review}`
            });

      - name: Auto Merge if Approved
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DECISION=$(cat /tmp/merge_decision.txt)
          echo "Merge decision: $DECISION"
          if [ "$DECISION" = "APPROVE" ]; then
            echo "Auto-merging PR #${PR_NUMBER}..."
            gh pr merge ${PR_NUMBER} --merge --auto
          else
            echo "PR not approved for auto-merge. Decision: $DECISION"
          fi
