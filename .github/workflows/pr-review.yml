name: PR Auto Review

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Call Agent for PR Review
        id: agent
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SESSION_ID: ${{ github.repository }}-pr-${{ github.event.pull_request.number }}
        run: |
          PROMPT="请审查以下 Pull Request：
          - 仓库: ${REPO}
          - PR #${PR_NUMBER}: ${PR_TITLE}
          - 链接: ${PR_URL}
          - 作者: ${AUTHOR}
          - 分支: ${HEAD_REF} → ${BASE_REF}

          请分析变更内容、评估风险等级，并给出审查意见。"

          # 调用 Agent API（SSE 流式），收集完整响应
          RESPONSE=$(curl -sN -X POST http://aigw.agentscraft.com/githubtl/api/console/chat \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -H "X-Agent-Id: default" \
            -H "x-api-key: ${AGENT_API_KEY}" \
            --max-time 300 \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              --arg session "$SESSION_ID" \
              '{
                input: [{ role: "user", content: [{ type: "text", text: $prompt }] }],
                session_id: $session,
                user_id: "default",
                channel: "github-cli",
                stream: true
              }')")

          # 从 SSE 流中提取最终文本内容
          # 1. 去掉 "data: " 前缀
          # 2. 精确匹配顶层 object=content 且 status=completed 的行
          # 3. 取最后一条（最终结果）
          REVIEW=$(echo "$RESPONSE" \
            | sed 's/^data: //' \
            | grep -E '^\{.*"object":"content".*"status":"completed"' \
            | tail -1 \
            | jq -r '.text // empty')

          if [ -z "$REVIEW" ]; then
            REVIEW="⚠️ Agent 未返回有效审查结果，请手动检查。"
          fi

          # 将结果写入文件避免 shell 转义问题
          echo "$REVIEW" > /tmp/review.md

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **AI Code Review**\n\n${review}`
            });
